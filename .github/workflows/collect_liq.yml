# collect_liq.yml — hourly Bybit liquidation listener (public repo: unlimited
# Actions minutes; liquidation prints are public market data).
# Lives at .github/workflows/collect_liq.yml
# Coverage: two ~25 min windows per hour (:02 and :32); ~10 min/hour blind spot
# during commit+restart — recorded here as the dataset's known evidence-grade
# limitation.

name: bybit-liq-collector

on:
  schedule:
    - cron: "2 * * * *"
    - cron: "32 * * * *"   # second chance — GitHub skips whole slots under load;
                           # two draws per hour cut the odds of losing an hour.
                           # :32 (not :37) so this window ends ~:58, clear of the
                           # next :02 trigger — cancel-in-progress would otherwise
                           # kill it before its commit step.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liq-collector
  cancel-in-progress: true      # a late-running previous window yields to the new hour

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install websocket-client requests

      - name: Listen for liquidations (25 min window)
        env:
          LIQ_RUN_SECONDS: "1500"   # 25 min, so the :02 and :32 windows both fit in the hour
        run: python liq_collector.py

      - name: Commit and push
        if: always()            # partial windows still get committed
        run: |
          git config user.name "liq-collector-bot"
          git config user.email "liq-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No liquidations captured this window (calm tape or early cancel)"
            exit 0
          fi
          git commit -m "liq window $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push origin main
